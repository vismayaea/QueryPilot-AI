[project]
name = "text2sql-agent"
version = "0.1.0"
description = "A simple text-to-SQL agent using LangChain's create_agent and Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.11",
    "langchain-google-genai>=2.1.0",
    "langchain-community>=0.3.0",
    "langgraph>=1.0.6",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "fastapi>=0.150.0",
    "python-multipart>=0.0.7",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
    "sqlglot>=30.23.0",
    "streamlit>=1.66.0",
]

[project.urls]
Repository = "https://github.com/kevinbfrank/text-to-sql-agent"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
exclude = ["data*", "tests*"]

